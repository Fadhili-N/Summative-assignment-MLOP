events {}
http {
  client_max_body_size 100m;
  server {
    listen 80;
    # Docker's DNS returns every replica of "app"; re-resolve often so scaling up/down is picked up.
    resolver 127.0.0.11 valid=5s;
    location / {
      set $upstream http://app:8000;
      proxy_pass $upstream;
      proxy_read_timeout 300s;
    }
  }
}
